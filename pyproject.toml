[project]
name = "piecad"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Yashwanth M", email = "byg2281999@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "mcp>=2.1.1",
    "openai>=3.3.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.52.4",
    "qrcode[pil]>=7.4.2",
]

[project.scripts]
piecad = "piecad:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
